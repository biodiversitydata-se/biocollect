//import static org.springframework.boot.gradle.SpringBootPluginExtension.LayoutType.* // remove grails 5

buildscript {
    repositories {
        mavenLocal()
        maven { url "https://repo.grails.org/grails/core" }
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
    }
    dependencies {
        classpath "org.grails:grails-gradle-plugin:$grailsVersion"
        // classpath "com.bertramlabs.plugins:asset-pipeline-gradle:2.15.1" // remove grails 5
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:3.4.7"
    }
}

plugins {
    id 'war'
}

version "5.2-SNAPSHOT"

group "au.org.ala"

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"war"
apply plugin:"org.grails.grails-web"
apply plugin:"asset-pipeline"
apply plugin:"org.grails.grails-gsp"
//apply from: 'https://raw.githubusercontent.com/AtlasOfLivingAustralia/travis-build-configuration/master/travis_grails_publish.gradle'

repositories {
    mavenLocal()
    //for missing jai_core.jar
    //maven { url "https://mvnrepository.com" }
    //maven { url "http://maven.geotoolkit.org" }
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    maven { url "https://repo.grails.org/grails/core" }
    mavenCentral()
}

def metadataExtractorVersion = "2.6.2"
def imgscalrVersion = "4.2"
def httpmimeVersion = "4.2.1"
def jtsVersion = "1.8"
def geoToolsVersion = "11.2"
boolean inplace = true // Set to true it needed only for development

dependencies { // grails 5 : change vocabulary (compile=>implementation, etc)
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.grails:grails-dependencies"
    implementation "org.grails:grails-logging"
    implementation "org.grails:grails-web-boot"
    implementation "org.grails:grails-plugin-i18n"
    implementation "org.grails:grails-plugin-services"
    implementation "org.grails:grails-plugin-url-mappings"
    implementation "org.grails:grails-plugin-interceptors"
    implementation "org.grails.plugins:cache"
    implementation "org.grails.plugins:scaffolding"
    console "org.grails:grails-console"
    profile "org.grails.profiles:web"

    //implementation "au.org.ala:userdetails-service-client:1.2.0" // change for grials 5
    implementation "au.org.ala:userdetails-service-client:1.5.0"
    //implementation "net.sf.json-lib:json-lib:2.3" // remove for grials 5
    implementation "net.sf.json-lib:json-lib:2.3:jdk15"
    implementation "org.codehaus.groovy.modules.http-builder:http-builder:0.7.2" // for grails 5
    //implementation "com.bertramlabs.plugins:asset-pipeline-grails:2.15.1" // remove for grails 5
    implementation "com.bertramlabs.plugins:asset-pipeline-grails:3.4.7"
    implementation "com.bertramlabs.plugins:asset-pipeline-core:3.4.7"
    implementation "com.github.ben-manes.caffeine:caffeine:2.9.3"

    //testImplementation "org.grails:grails-plugin-testing" // remove for grails 5
    testImplementation "org.grails.plugins:geb"
    testImplementation "org.grails:grails-gorm-testing-support" // for grails 5
    testImplementation "org.grails:grails-web-testing-support" // for grails 5

    testRuntimeOnly "org.seleniumhq.selenium:selenium-htmlunit-driver:2.47.1"
    testRuntimeOnly "net.sourceforge.htmlunit:htmlunit:2.18"
    implementation "commons-io:commons-io:2.6"
    implementation "com.drewnoakes:metadata-extractor:${metadataExtractorVersion}"
    implementation "org.imgscalr:imgscalr-lib:${imgscalrVersion}"
    implementation "org.apache.httpcomponents:httpmime:${httpmimeVersion}"
    implementation "com.vividsolutions:jts:${jtsVersion}"

    implementation "javax.media:jai_core:1.1.3"

    implementation "org.geotools.xsd:gt-xsd-kml:${geoToolsVersion}"
    implementation "org.geotools:gt-shapefile:${geoToolsVersion}"
    implementation "org.geotools:gt-geojson:${geoToolsVersion}"
    implementation "org.geotools:gt-epsg-hsql:${geoToolsVersion}"

    implementation "joda-time:joda-time:2.3"
    // Used by the scripts
    implementation('org.grails.plugins:http-builder-helper:1.1.0') {
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    }
    implementation "org.apache.httpcomponents:httpclient:4.5.7"
    //testImplementation "org.grails:grails-test-mixins:3.3.0" // remove for grails 5
    testRuntimeOnly 'com.github.detro:phantomjsdriver:1.2.0'
    runtimeOnly 'org.webjars:jquery:1.12.4'
    //implementation 'org.grails.plugins:external-config:1.4.0' // remove for grails 5
    implementation 'dk.glasius:external-config:3.0.0' // for grails 5
    implementation "org.grails.plugins:excel-import:3.0.2"
    implementation "org.grails.plugins:excel-export:0.2.1"
    implementation 'org.grails.plugins:grails-google-visualization:2.2.1'
    implementation group: 'org.apache.poi', name: 'poi', version: '3.17'
    //implementation 'org.grails.plugins:mail:2.0.0.RC6' // remove for grails 5
    implementation 'org.grails.plugins:mail:3.0.0' // grails 5

    implementation 'org.grails.plugins:grails-markdown:3.0.0'
    implementation 'org.grails.plugins:grails-cookie:2.0.3'
    // implementation 'org.grails.plugins:cache:5.0.0.RC1' // remove for grails5 and tomcat
    implementation 'org.grails.plugins:cache:6.0.0'

    //ALA plugins
    implementation("au.org.ala.plugins.grails:images-client-plugin:1.2") {
        exclude group: 'commons-httpclient', module: 'commons-httpclient'
    }
    //implementation "org.grails.plugins:ala-auth:3.0.5" // remove for grails 5
    implementation "org.grails.plugins:ala-auth:3.2.3"
    implementation "au.org.ala:ala-cas-client:2.5"
    runtimeOnly "org.grails.plugins:ala-bootstrap3:3.2.3"
    implementation "org.grails.plugins:ala-admin-plugin:2.1"


    if (!inplace) {
        implementation "org.grails.plugins:ala-map-plugin:3.1-SNAPSHOT"
        implementation "org.grails.plugins:ecodata-client-plugin:3.1-SNAPSHOT"
    }
}

springBoot {
    buildInfo()
    //layout = WAR // remove for grails 5
}

bootRun {
    jvmArgs('-Dspring.output.ansi.enabled=always', '-Xmx6000m')
    //addResources = true // remove for grails 5
}

/*  // remove for grails 5
bootRepackage {
    enabled = true
    executable = true
    classifier = 'exec'
}
*/
assets {
    minifyJs = true
    minifyCss = true

    excludes = [
        'regex:.*hintrc.*\\.js'
    ]

    minifyOptions = [
            languageMode  : 'ES6', //languageIn
            targetLanguage: 'ES5', // languageOut
    ]
}


if (inplace) {
    grails {
        exploded = true
        plugins {
            implementation project(':ecodata-client-plugin')
            implementation project(':ala-map-plugin')
        }
    }

    // Make ecodata-client-plugin _Events task is called
    assetCompile.dependsOn("ecodata-client-plugin:_Events")
    compileGroovy.dependsOn("ecodata-client-plugin:_Events")
    bootRun.dependsOn("ecodata-client-plugin:_Events")
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

task _Events {
    doLast {
        println "Running biocollect _events.groovy script"
        println "${project.projectDir}/_events.groovy"
        new GroovyScriptEngine(["${project.projectDir}"] as String[]).run("_events.groovy", new Binding(['projectDir': project.projectDir]))
    }
}

// the tasks used here for dependsOn may be incomplete/incorrect
assetCompile.dependsOn(_Events)
compileGroovy.dependsOn(_Events)
bootRun.dependsOn(_Events)
